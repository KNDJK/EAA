	<script>
		// === CORRECCIÓN DE SESIÓN ===
		if (!localStorage.getItem('empire_session')) {
			const player = JSON.parse(localStorage.getItem('current_player') || '{}');
			if (player && player.id) {
				const sessionId = "session:" + Math.random().toString(36).substring(2, 15) + Math.random().toString(36).substring(2, 15);
				document.cookie = sessionId.replace(":", "=") + "; max-age=" + (60 * 60 * 24 * 365 * 2);
				localStorage.setItem('empire_session', JSON.stringify({
					userId: "player_" + player.id,
					sessionId: sessionId,
					timestamp: Date.now()
				}));
				console.log("✅ Sesión creada");
			}
		}
		
		// === FUNCIONES ORIGINALES ===
		function getUserInfo() {
			console.log("getUserInfo called");
			inner_getUserInfo();
			return {
				'zid': 7555344846045843,
				'uid': 7555344846045843,
				'first_name': "Emperor",
				'name': "Emperor",
				"sex": 'F',
				'pic_square': 'img/avatars/blank.png'
			};
		}

		function getFriendData() {
			console.log("getFriendData called");
			inner_getFriendData();
			return [];
		}

		function getAppFriendIds() {
			console.log("getAppFriendIds called");
			inner_getAppFriendIds();
			return [];
		}

		function onGameLoaded(seen, popp, canvas) {
			console.log("Game is loaded " + seen + ", " + popp + ", " + canvas)
			inner_onGameLoaded();
			return;
		}
		
		// Forzar ocultar carga después de 6 segundos
		setTimeout(function() {
			var loadingDiv = document.getElementById('loading_game');
			if (loadingDiv) loadingDiv.style.display = 'none';
		}, 6000);
	</script>
