<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8"/>
    <title>Login - Empires &amp; Allies</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login-box {
            background: #0f3460;
            border-radius: 20px;
            padding: 40px;
            width: 350px;
            text-align: center;
        }
        h2 { color: white; margin-bottom: 30px; }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: none;
            border-radius: 8px;
            background: #1a1a2e;
            color: white;
            font-size: 16px;
        }
        button {
            background: #e94560;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
        }
        button:hover { background: #ff6b8a; }
        .register-link { margin-top: 20px; color: #aaa; }
        .register-link a { color: #e94560; text-decoration: none; }
        .error { color: #ff6b8a; margin-top: 10px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>🔐 Iniciar Sesión</h2>
        <input type="text" id="username" placeholder="Nombre de usuario">
        <input type="password" id="password" placeholder="Contraseña">
        <button onclick="doLogin()">Entrar al Imperio</button>
        <div id="errorMsg" class="error"></div>
        <div class="register-link">¿Nuevo? <a href="new.html">Crear imperio</a></div>
    </div>
    <script>
        async function doLogin() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');
            
            if (!username || !password) {
                errorMsg.textContent = 'Completa todos los campos';
                return;
            }
            
            errorMsg.textContent = 'Conectando...';
            
            try {
                const response = await fetch('/api/login_check.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await response.json();
                
                if (data.success) {
                    localStorage.setItem('current_player', JSON.stringify(data.player));
                    localStorage.setItem('session_token', data.session_token);
                    window.location.href = 'home.html';
                } else {
                    errorMsg.textContent = data.error;
                }
            } catch(e) {
                errorMsg.textContent = 'Error de conexión: ' + e.message;
            }
        }
        
        document.addEventListener('keypress', e => { if (e.key === 'Enter') doLogin(); });
    </script>
</body>
</html>
